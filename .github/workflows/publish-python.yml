# SPDX-License-Identifier: MPL-2.0
name: Publish Python and GitHub Release

on:
  workflow_dispatch:
    inputs:
      index:
        description: Package index
        type: choice
        options: [testpypi, pypi]
        default: testpypi
      version:
        description: Version already committed in pyproject.toml
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: publish-python-${{ inputs.index }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'wavefnd/hmath' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: haskell-actions/setup@7fd2bb5ca789761088fbc831406b2910e47e56f1 # v2
        with:
          ghc-version: '9.10.3'
          cabal-version: '3.16.1.0'
      - name: Check requested version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib
          metadata = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          if metadata['project']['version'] != os.environ['REQUESTED_VERSION']:
              raise SystemExit('Requested version does not match the committed Python package version')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('version=' + metadata['project']['version'], file=output)
          PY
      - name: Build and validate the distributions
        run: |
          python -m pip install build twine numpy cffi
          python -m build --outdir dist
          python -m twine check --strict dist/*
          cabal update
          python meson-build.py . build-python/libhmath.so build-python/libhmath.so.1 --builddir build-python/cabal
          python -m pip install dist/*.whl
          HMATH_LIBRARY="$PWD/build-python/libhmath.so" python - <<'PY'
          import pathlib
          import runpy
          import hmath
          if 'site-packages' not in pathlib.Path(hmath.__file__).parts:
              raise SystemExit('Validation must import the installed wheel')
          runpy.run_path('bindings/python/test_bindings.py', run_name='__main__')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.index }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: python-distributions
          path: dist/
      - name: Publish to TestPyPI
        if: inputs.index == 'testpypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: inputs.index == 'pypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  github-release:
    if: inputs.index == 'pypi'
    needs: [build, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: python-distributions
          path: dist/
      - name: Create the versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          tag="v$RELEASE_VERSION"
          existing="$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha 2>/dev/null || true)"
          if [ -n "$existing" ] && [ "$existing" != "$RELEASE_SHA" ]; then
            echo "Tag $tag points to another commit; refusing to publish mismatched artifacts."
            exit 1
          fi
          gh release create "$tag" dist/* \
            --target "$RELEASE_SHA" \
            --title "HMath $RELEASE_VERSION" \
            --generate-notes \
            --latest
