# SPDX-License-Identifier: MPL-2.0
name: Publish HMath release

on:
  workflow_dispatch:
    inputs:
      index:
        description: Package index
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-hmath-${{ inputs.index }}
  cancel-in-progress: false

jobs:
  select:
    if: github.repository == 'wavefnd/hmath' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    outputs:
      run_id: ${{ steps.candidate.outputs.candidate_run_id }}
      version: ${{ steps.candidate.outputs.version }}
      source_sha: ${{ steps.candidate.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resume a staged candidate or prepare this source
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          import sys
          sys.path.insert(0, "tools")
          import select_release_candidate as selector

          repository = os.environ["GITHUB_REPOSITORY"]
          commit = os.environ["GITHUB_SHA"]
          version = selector.release_version()
          receipt = selector._receipt_run(repository, version)
          if receipt:
              run_id = receipt["candidate_run_id"]
              source = receipt["candidate_sha"]
              run = selector.gh_read(f"repos/{repository}/actions/runs/{run_id}")
              if run.get("path") == selector.WORKFLOW:
                  selector.validate_run(run, repository, source, run_id)
              else:
                  if (str(run.get("id")) != run_id
                      or run.get("repository", {}).get("full_name", "").casefold() != repository.casefold()
                      or run.get("path") != ".github/workflows/publish-python.yml"
                      or run.get("head_sha") != source
                      or run.get("head_branch") != "master"
                      or run.get("event") != "workflow_dispatch"
                      or run.get("status") != "completed"):
                      raise ValueError("staged candidate does not belong to a completed release run")
                  pages = selector.gh_read(
                      f"repos/{repository}/actions/runs/{run_id}/jobs?filter=all&per_page=100",
                      paginate=True,
                  )
                  ready = [job for page in pages for job in page["jobs"]
                           if job["name"].split("/")[-1].strip() == "Release candidate verified"]
                  if not ready or not any(job["status"] == "completed" and job["conclusion"] == "success"
                                          for job in ready):
                      raise ValueError("staged release never completed candidate verification")
              if selector.source_version(repository, source) != version:
                  raise ValueError("staged candidate version differs from its source")
          else:
              # First publication builds and verifies its own candidate in this run.
              run_id, source = "", commit
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"candidate_run_id={run_id}", file=output)
              print(f"candidate_sha={source}", file=output)
              print(f"version={version}", file=output)
          PY

  prepare:
    needs: select
    if: needs.select.outputs.run_id == ''
    uses: ./.github/workflows/prepare-release.yml

  publish:
    needs: [select, prepare]
    if: ${{ !cancelled() && needs.select.result == 'success' && (needs.select.outputs.run_id != '' || needs.prepare.result == 'success') }}
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.index }}
    permissions:
      id-token: write
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download the selected immutable candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ needs.select.outputs.run_id || github.run_id }}
        run: gh run download "$CANDIDATE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-candidate --dir candidate
      - name: Verify all artifacts and source identity
        env:
          SOURCE_SHA: ${{ needs.select.outputs.source_sha }}
          VERSION: ${{ needs.select.outputs.version }}
          RUN_ID: ${{ needs.select.outputs.run_id || github.run_id }}
        run: python tools/verify_release_candidate.py candidate --commit "$SOURCE_SHA" --version "$VERSION" --run-id "$RUN_ID"
      - name: Verify existing package hashes before external writes
        id: remote
        env:
          SOURCE_SHA: ${{ needs.select.outputs.source_sha }}
        run: python tools/check_release_remote.py --python candidate --native candidate --commit "$SOURCE_SHA" --index '${{ inputs.index }}'
      - name: Require Hackage configuration for a new Haskell upload
        if: inputs.index == 'pypi' && steps.remote.outputs.haskell_complete != 'true'
        env:
          HACKAGE_TOKEN: ${{ secrets.HACKAGE_TOKEN }}
        run: test -n "$HACKAGE_TOKEN"
      - name: Verify and stage all GitHub assets before package publication
        if: inputs.index == 'pypi'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.select.outputs.source_sha }}
        run: python tools/publish_github_release.py candidate --repository "$GITHUB_REPOSITORY" --commit "$SOURCE_SHA" --stage-only
      - uses: ./.github/actions/setup-haskell
        if: inputs.index == 'pypi' && steps.remote.outputs.haskell_complete != 'true'
        with:
          ghc-version: '9.10.3'
      - name: Publish the verified Cabal source package
        if: inputs.index == 'pypi' && steps.remote.outputs.haskell_complete != 'true'
        env:
          HACKAGE_TOKEN: ${{ secrets.HACKAGE_TOKEN }}
          VERSION: ${{ needs.select.outputs.version }}
        run: cabal upload --publish --token="$HACKAGE_TOKEN" "candidate/hmath-$VERSION.tar.gz"
      - name: Stage Python-only upload files
        run: |
          mkdir dist
          cp candidate/*.whl candidate/hmath_python-*.tar.gz dist/
      - name: Publish to TestPyPI
        if: inputs.index == 'testpypi' && steps.remote.outputs.python_complete != 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
      - name: Publish to PyPI
        if: inputs.index == 'pypi' && steps.remote.outputs.python_complete != 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          skip-existing: true
      - name: Publish the staged GitHub release
        if: inputs.index == 'pypi'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.select.outputs.source_sha }}
        run: python tools/publish_github_release.py candidate --repository "$GITHUB_REPOSITORY" --commit "$SOURCE_SHA"
