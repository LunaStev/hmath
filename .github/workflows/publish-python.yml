# SPDX-License-Identifier: MPL-2.0
name: Publish Python and GitHub Release

on:
  workflow_dispatch:
    inputs:
      index:
        description: Package index
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

concurrency:
  group: publish-python-${{ inputs.index }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'wavefnd/hmath' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/python-wheels.yml

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.index }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: python-distributions
          path: dist/
      - name: Publish to TestPyPI
        if: inputs.index == 'testpypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: inputs.index == 'pypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  github-release:
    if: inputs.index == 'pypi'
    needs: [build, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: python-distributions
          path: dist/
      - name: Create the versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          tag="v$RELEASE_VERSION"
          error_log="$RUNNER_TEMP/release-tag-error.log"
          if ! existing="$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha 2>"$error_log")"; then
            if ! grep -Eq '\(HTTP (404|422)\)' "$error_log"; then
              cat "$error_log" >&2
              exit 1
            fi
            existing=""
          fi
          if [ -n "$existing" ] && [ "$existing" != "$RELEASE_SHA" ]; then
            echo "Tag $tag points to another commit; refusing to publish mismatched artifacts."
            exit 1
          fi
          gh release create "$tag" dist/* \
            --target "$RELEASE_SHA" \
            --title "HMath $RELEASE_VERSION" \
            --generate-notes \
            --latest
