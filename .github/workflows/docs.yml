# SPDX-License-Identifier: MPL-2.0
name: Documentation

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      python-runtime:
        description: Python package to execute the documentation against
        type: choice
        options: [checkout, released]
        default: checkout

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Test documentation validators
        run: |
          python -m unittest discover -s tools -p 'test_docs_checks.py'
          python tools/check_api_docs.py --python-only
          python tools/check_docs_examples.py --check-syntax
      - uses: ./.github/actions/setup-haskell
        with:
          ghc-version: '9.10.3'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build-docs/cabal
          key: docs-haddock-${{ hashFiles('hmath.cabal', 'cabal.project', 'src/**', 'cbits/**') }}
          restore-keys: docs-haddock-
      - name: Build documentation and Haskell reference
        run: |
          python -m pip install -r requirements-docs.txt
          python tools/build_docs.py
      - name: Native dependencies for the checkout wheel
        if: inputs.python-runtime != 'released'
        run: |
          sudo apt-get update
          sudo apt-get install -y liblapacke-dev libopenblas-dev zlib1g-dev
      - name: Verify Python documentation examples against the selected package
        env:
          DOCS_PYTHON_RUNTIME: ${{ inputs.python-runtime || 'checkout' }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import subprocess
          import sys
          import tomllib

          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          target = os.environ['DOCS_PYTHON_RUNTIME']
          package = '.[numpy,cffi]' if target == 'checkout' else f'hmath-python[numpy,cffi]=={version}'
          print(f'Documentation package source: {target}', flush=True)
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall', package], check=True)
          subprocess.run([sys.executable, 'tools/check_docs_examples.py', '--expected-version', version], check=True)
          PY
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    if: github.repository == 'wavefnd/hmath' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    concurrency:
      group: documentation-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
