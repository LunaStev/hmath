# SPDX-License-Identifier: MPL-2.0
name: Validate

on:
  push:
    branches: [master]
    paths-ignore: ['docs/**', 'mkdocs.yml', 'requirements-docs.txt', 'tools/build_docs.py', 'README.md']
  pull_request:
    paths-ignore: ['docs/**', 'mkdocs.yml', 'requirements-docs.txt', 'tools/build_docs.py', 'README.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        ghc: ['9.6.7', '9.10.3']
        buildtype: [debug, release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: haskell-actions/setup@7fd2bb5ca789761088fbc831406b2910e47e56f1 # v2
        id: haskell
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: '3.16.1.0'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cabal/packages
            ${{ steps.haskell.outputs.cabal-store }}
            dist-newstyle
            build-ci/cabal
            build-interchange/cabal
          key: cabal-${{ runner.os }}-${{ matrix.ghc }}-${{ matrix.buildtype }}-${{ hashFiles('hmath.cabal', 'cabal.project', 'src/**', 'cbits/**', 'test/**', 'bench/**') }}
          restore-keys: cabal-${{ runner.os }}-${{ matrix.ghc }}-${{ matrix.buildtype }}-
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y liblapacke-dev libopenblas-dev zlib1g-dev cmake ninja-build clang
          python -m pip install meson==1.8.5 numpy cffi
      - name: Differential validation dependencies
        if: matrix.ghc == '9.10.3' && matrix.buildtype == 'release'
        run: |
          python -m pip install scipy h5py pyarrow onnx
          cabal update
      - name: Wave compiler
        if: matrix.ghc == '9.10.3' && matrix.buildtype == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/wave"
          gh release download v0.2.1-pre-beta --repo wavefnd/Wave --pattern wave-v0.2.1-pre-beta-x86_64-linux-gnu.tar.gz --dir "$RUNNER_TEMP/wave"
          cd "$RUNNER_TEMP/wave"
          echo '4e5daf46a93414e00b8ea073eda09e4b7aa7d248cc03f2aeb965a36fc9b0fef0  wave-v0.2.1-pre-beta-x86_64-linux-gnu.tar.gz' | sha256sum --check
          tar -xzf wave-v0.2.1-pre-beta-x86_64-linux-gnu.tar.gz
          test -n "$(find "$RUNNER_TEMP/wave" -type f -name wavec -print -quit)"
          find "$RUNNER_TEMP/wave" -type f -name wavec -printf '%h\n' >> "$GITHUB_PATH"
      - name: Build and integration tests
        run: |
          wave_tests=auto
          if [ '${{ matrix.ghc }}' = '9.10.3' ] && [ '${{ matrix.buildtype }}' = release ]; then
            wave_tests=enabled
          fi
          meson setup build-ci --buildtype=${{ matrix.buildtype }} -Doffline=true -Dwerror=true -Dpython_bindings=enabled -Dwave_bindings="$wave_tests" -Dbenchmarks=true
          meson compile -C build-ci
          meson test -C build-ci --print-errorlogs
          python tools/check_install.py build-ci
          python tools/check_abi.py build-ci/libhmath.so
      - name: Properties and interchange
        if: matrix.ghc == '9.10.3' && matrix.buildtype == 'release'
        run: |
          cabal test hmath-properties -fvalidation-frameworks -fcriterion-benchmarks --test-show-details=direct
          python tools/check_interchange.py --builddir=build-interchange --require-optional
      - name: Sanitized metadata and DLPack fuzzing
        if: matrix.ghc == '9.10.3' && matrix.buildtype == 'release'
        run: python tools/run_fuzz.py --runs=100000 --output=build-ci/fuzz.log
      - name: Criterion fixture and native benchmark smoke
        if: matrix.ghc == '9.10.3' && matrix.buildtype == 'release'
        run: |
          cabal bench hmath-criterion -fvalidation-frameworks -fcriterion-benchmarks --benchmark-options='--iters 1'
          python tools/benchmark.py --library=build-ci/libhmath.so --native=build-ci/hmath-native-benchmark --iterations=10 --output=build-ci/benchmark.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-${{ matrix.ghc }}-${{ matrix.buildtype }}
          path: |
            build-ci/meson-logs/
            build-ci/hmath-build.json
            build-ci/fuzz.log
            build-ci/benchmark.*

  portability-build:
    # Build probes do not establish full native platform support.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: haskell-actions/setup@7fd2bb5ca789761088fbc831406b2910e47e56f1 # v2
        id: haskell
        with:
          ghc-version: '9.10.3'
          cabal-version: '3.16.1.0'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ steps.haskell.outputs.cabal-store }}
            dist-newstyle
          key: cabal-portability-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hmath.cabal', 'cabal.project', 'src/**', 'cbits/**') }}
          restore-keys: cabal-portability-${{ runner.os }}-${{ runner.arch }}-
      - run: cabal build --offline lib:hmath flib:hmath -f-interchange-zlib --ghc-options="-Wall -Werror"
