site_name: HMath
site_description: HMath mathematics and numerical computing documentation
site_url: https://wavefnd.github.io/hmath/
repo_url: https://github.com/wavefnd/hmath
repo_name: wavefnd/hmath
edit_uri: edit/master/docs/
copyright: HMath contributors · MPL-2.0
strict: true
theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
extra_css:
  - stylesheets/api.css
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
plugins:
  - search
markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true
  - toc:
      permalink: true
      toc_depth: 3
nav:
  - Overview: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - First calculation: getting-started/first-calculation.md
      - Choose an operation: getting-started/choose-an-operation.md
  - How-to guides:
      - NumPy interoperability: guides/numpy.md
      - Validate a matrix calculation: guides/matrix-calculation.md
      - Solve least-squares problems (Haskell): guides/least-squares.md
      - Differentiate and integrate (Haskell): guides/calculus.md
      - Summarize data (Haskell): guides/statistics.md
      - C integration: guides/c.md
      - Borrow storage safely (C): guides/borrowed-storage.md
      - Wave integration: guides/wave.md
      - Build from source: guides/build.md
      - Troubleshooting: guides/troubleshooting.md
      - Dense linear algebra: linear-algebra.md
  - Explanation:
      - Architecture and ownership: explanation/architecture.md
      - Numerical conventions: explanation/numerical-conventions.md
      - Compatibility and releases: explanation/releases.md
  - Contributing: contributing.md
  - Release process: guides/releasing.md
  - API Reference:
      - Python API: reference/python.md
      - C ABI: reference/c.md
      - Exact numeric types: reference/numeric-types.md
      - Numeric type functions: reference/numeric-type-functions.md
      - Exact units: reference/units-values.md
      - Error contracts: reference/errors.md
      - Quaternions and rotations: reference/rotations.md
      - Time series: reference/timeseries-bindings.md
      - Structured values: reference/values.md
      - Polynomial bindings: reference/polynomial.md
      - Generic matrix values: reference/matrix-values.md
      - Image bindings: reference/image-bindings.md
      - Expressions and symbolic algebra: reference/expression-bindings.md
      - Extended linear algebra: reference/linear-bindings.md
      - Probability and random generators: reference/stochastic.md
      - Signal, Fourier and interpolation: reference/spectral-bindings.md
      - Geometry: reference/geometry-bindings.md
      - Numerical solvers: reference/numerical-solvers.md
      - Graph bindings: reference/graph-bindings.md
      - Numeric bindings: reference/numeric-bindings.md
      - Generic numeric instances: reference/numeric-objects.md
      - Foundation collections: reference/foundation.md
      - Algebra and exact domains: reference/algebra-values.md
      - Static shapes: reference/shapes.md
      - Typed tensor operations: reference/tensor-bindings.md
      - Deep learning: reference/deeplearning-bindings.md
      - Machine learning: reference/machinelearning-bindings.md
      - Complex and special functions: reference/scalar-extras.md
      - Array and file interchange: reference/interchange-bindings.md
      - Matrix bindings: reference/matrix-bindings.md
      - Autodiff bindings: reference/autodiff-bindings.md
      - Buffer execution: reference/execution.md
      - Typed storage buffers: reference/buffer-bindings.md
      - Optimizer bindings: reference/optimization-bindings.md
      - Wave API: reference/wave.md
      - Haskell API: reference/haskell.md
      - QR contracts (Haskell): reference/qr.md
